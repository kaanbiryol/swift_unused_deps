name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          mkdir -p "$HOME/bin"
          ln -sf "$(brew --prefix)/bin/bazelisk" "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Bazel version
        run: bazel version

      - name: Build CLI
        run: bazel build //:swift_unused_deps

      - name: Test
        run: bazel test //...

      - name: Smoke Analyze Clean Example
        run: bazel run //:swift_unused_deps -- //example/Targets/CleanTarget:CleanTarget --min-confidence high
