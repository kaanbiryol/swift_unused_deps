name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          mkdir -p "$HOME/bin"
          ln -sf "$(brew --prefix)/bin/bazelisk" "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Bazel version
        run: bazel version

      - name: Build CLI
        run: bazel build //:swift_unused_deps

      - name: Test
        run: bazel test //...

      - name: Setup Bats
        uses: mig4/setup-bats@v1
        with:
          bats-version: "1.13.0"

      - name: Fixture integration tests
        run: bats tools/swift_unused_deps/tests/acceptance
